<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.1">
<title>Why ODEs? — First-Order ODE — Shir Sivroni</title>
<meta name="description" content="Everyday phenomena modelled by first-order differential equations: radioactive decay, falling with drag, oscillations, and epidemic growth. Interactive lesson by Shir Sivroni.">
<meta name="author" content="Dr. Shir Sivroni">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://shir-openu.github.io/ode-first-order/background.html">
<link rel="stylesheet" href="assets/lesson.css">
<style>
  .grid5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
  .grid5 .panel { margin: 0; }
  .grid5 canvas { aspect-ratio: 3 / 2; }
  .grid5 .name { font-weight: 600; margin-bottom: 2px; }
  .grid5 .eqline { color: var(--muted); font-size: 0.9rem; }
</style>
<script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] } };</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
<body class="theme-pink">
<div class="container">

  <nav>
    <a href="./" class="back-link">Back to First-Order ODE</a>
    <span class="page-tag">Background</span>
  </nav>

  <h1>Why Differential Equations?</h1>
  <div class="accent-bar"></div>

  <section class="card">
    <p>A differential equation links a quantity to its own rate of change. That single idea models much of the physical world — here are five familiar examples and the curves their equations predict.</p>
    <div class="grid5">
      <figure class="panel">
        <div class="name">Radioactive decay</div>
        <div class="eqline">\( N' = -\lambda N \)</div>
        <canvas id="cv-decay" class="wide"></canvas>
      </figure>
      <figure class="panel">
        <div class="name">Falling with drag</div>
        <div class="eqline">\( v' = g - k v \)</div>
        <canvas id="cv-fall" class="wide"></canvas>
      </figure>
      <figure class="panel">
        <div class="name">Spring / oscillation</div>
        <div class="eqline">\( x'' = -\omega^2 x \)</div>
        <canvas id="cv-spring" class="wide"></canvas>
      </figure>
      <figure class="panel">
        <div class="name">Damped pendulum</div>
        <div class="eqline">\( \theta'' + b\theta' + \omega^2\theta = 0 \)</div>
        <canvas id="cv-pend" class="wide"></canvas>
      </figure>
      <figure class="panel">
        <div class="name">Epidemic growth</div>
        <div class="eqline">\( I' = r I\left(1 - \tfrac{I}{K}\right) \)</div>
        <canvas id="cv-virus" class="wide"></canvas>
      </figure>
    </div>
  </section>

  <div class="footer">&copy; Developed by Shir Sivroni</div>
</div>

<script src="assets/ode-anim.js"></script>
<script>
addEventListener('DOMContentLoaded', () => {
  const { Plot, Timeline, COLORS } = ODE;
  const P = { orange: '#ff9b1e', pink: '#ea5cd5', magenta: '#d41bb9', lilac: '#bb7be6', sky: '#61a3ed', green: '#39d461' };

  // helper: animate a single solution curve t -> [x, y(t)]
  function curve(id, opts, fn, color) {
    const plot = new Plot(document.getElementById(id), opts);
    new Timeline(plot.cv, () => { plot.clear(); plot.axes(); },
      [{ d: 2200, draw(p) { plot.param(fn, opts.t0, opts.t1, { color, width: 2.6, progress: p, head: true }); } }]);
  }

  curve('cv-decay', { xmin: 0, xmax: 4, ymin: 0, ymax: 1.05, t0: 0, t1: 4, xtick: 1, ytick: 0.5 },
    t => [t, Math.exp(-1.1 * t)], P.sky);

  curve('cv-fall', { xmin: 0, xmax: 4, ymin: 0, ymax: 1.05, t0: 0, t1: 4, xtick: 1, ytick: 0.5 },
    t => [t, 1 - Math.exp(-1.4 * t)], P.orange);   // rises to terminal velocity

  curve('cv-spring', { xmin: 0, xmax: 12, ymin: -1.1, ymax: 1.1, t0: 0, t1: 12, xtick: 3, ytick: 1 },
    t => [t, Math.cos(1.2 * t)], P.pink);

  curve('cv-pend', { xmin: 0, xmax: 12, ymin: -1.1, ymax: 1.1, t0: 0, t1: 12, xtick: 3, ytick: 1 },
    t => [t, Math.exp(-0.18 * t) * Math.cos(1.4 * t)], P.lilac);

  curve('cv-virus', { xmin: 0, xmax: 10, ymin: 0, ymax: 1.05, t0: 0, t1: 10, xtick: 2, ytick: 0.5 },
    t => [t, 1 / (1 + Math.exp(-1.3 * (t - 5)))], P.green);
});
</script>
</body>
</html>
